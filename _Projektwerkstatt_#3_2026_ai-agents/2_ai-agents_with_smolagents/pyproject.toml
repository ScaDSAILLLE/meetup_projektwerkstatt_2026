[project]
name = "scadsai-living-lab-starter"
version = "0.5.3"
description = "ScaDS.AI Living Lab Gradio starter scaffold (Welcome + Demo + About + Feedback, complete corporate design)"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fonttools[woff]>=4.47",
    "gradio>=6.0.1,<7.0.0",
    "pillow>=10",
    "python-dotenv>=1.0",
    "python-pptx>=1.0.2",
    "smolagents[openai]>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = "-ra -q"
